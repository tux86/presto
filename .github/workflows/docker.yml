name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: set the DOCKERHUB_IMAGE repository variable
      # (e.g. axforge/presto) plus the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
      # secrets. Without them the job still publishes to GHCR.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve target registries
        id: targets
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        # `run` uses bash -e, so a bare `[ -n "$X" ] && echo` would fail the
        # step whenever the variable is unset. GHCR also requires the image
        # name in lowercase; `tr` rather than ${x,,} so this is verifiable on
        # any shell, not only bash 4+.
        run: |
          owner=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          {
            echo 'images<<EOF'
            echo "ghcr.io/$owner"
            if [ -n "$DOCKERHUB_IMAGE" ]; then echo "$DOCKERHUB_IMAGE"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          # A manual run has no version to derive tags from, so it publishes
          # `edge` rather than producing an empty tag list and failing.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Presto
            org.opencontainers.image.description=Monthly activity reports for freelancers and consultants
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keeps the Docker Hub page from being an empty box.
      - name: Sync Docker Hub description
        if: vars.DOCKERHUB_IMAGE != '' && github.event_name == 'release'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE }}
          short-description: Monthly activity reports for freelancers and consultants
          readme-filepath: ./README.md
