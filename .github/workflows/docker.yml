name: Docker

on:
  # Called by the Release workflow. A release published with GITHUB_TOKEN does
  # not emit a `release` event — GitHub suppresses it to prevent recursion — so
  # chaining is what actually publishes an image, not the trigger below.
  workflow_call:
    inputs:
      version:
        description: Version to publish, without the leading v.
        required: true
        type: string
  # Safety net for a release created by hand, and a manual re-publish.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 2.0.0. Empty builds the current ref as :edge.
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Build the tag being published, not whatever main happens to be.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then version="${RELEASE_TAG#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: set the DOCKERHUB_IMAGE repository variable
      # (e.g. axforge/presto) plus the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
      # secrets. Without them the job still publishes to GHCR.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve target registries
        id: targets
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        # `run` uses bash -e, so a bare `[ -n "$X" ] && echo` would fail the
        # step whenever the variable is unset. GHCR also requires the image
        # name in lowercase; `tr` rather than ${x,,} so this is verifiable on
        # any shell, not only bash 4+.
        run: |
          owner=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          {
            echo 'images<<EOF'
            echo "ghcr.io/$owner"
            if [ -n "$DOCKERHUB_IMAGE" ]; then echo "$DOCKERHUB_IMAGE"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.targets.outputs.images }}
          # A dispatch with no version has nothing to derive semver from, so it
          # publishes `edge` rather than producing an empty tag list.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ steps.v.outputs.version != '' }}
            type=raw,value=edge,enable=${{ steps.v.outputs.version == '' }}
          labels: |
            org.opencontainers.image.title=Presto
            org.opencontainers.image.description=Monthly activity reports for freelancers and consultants
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keeps the Docker Hub page from being an empty box.
      #
      # Requiring a version here meant the description could only ever come
      # from a tag, so a README fix reached Docker Hub only on the back of an
      # unrelated code release. A versionless dispatch now syncs as well — but
      # only from the default branch, so an `edge` build off a feature branch
      # cannot overwrite the public page with work in progress.
      - name: Sync Docker Hub description
        if: >-
          vars.DOCKERHUB_IMAGE != '' &&
          (steps.v.outputs.version != '' || github.ref == 'refs/heads/main')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE }}
          short-description: Monthly activity reports for freelancers and consultants
          readme-filepath: ./README.md
