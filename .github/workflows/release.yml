name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Release tooling is pinned here rather than in devDependencies: it runs
      # only in CI, and semantic-release pulls in a few hundred packages that
      # nobody needs to install to work on Presto.
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bunx --bun \
            --package semantic-release@25 \
            --package @semantic-release/changelog@7 \
            --package @semantic-release/git@11 \
            -- semantic-release
