name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Needed by the Docker job below: a called workflow cannot hold more
  # permission than its caller.
  packages: write

jobs:
  release:
    name: Semantic release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # semantic-release authenticates the push itself with GITHUB_TOKEN.
          persist-credentials: false

      # Node, not Bun: semantic-release checks the runtime version and refuses
      # to run under Bun's node shim, which reports an unsupported release.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned here rather than in devDependencies: this runs only in CI and
      # pulls in a few hundred packages nobody needs to develop Presto.
      # conventional-changelog-conventionalcommits is not bundled with
      # semantic-release and the preset fails to load without it.
      - name: Semantic release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The version is read back from the tag semantic-release just created,
        # rather than parsed out of its log. No tag means no release happened.
        run: |
          npx --yes \
            --package semantic-release@25 \
            --package conventional-changelog-conventionalcommits@9 \
            --package @semantic-release/changelog@7 \
            --package @semantic-release/git@11 \
            -- semantic-release
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1 || true)
          if [ -n "$tag" ]; then
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

  # Chained rather than triggered by `release: published`. GitHub suppresses
  # events created with GITHUB_TOKEN, so publishing a release from this job
  # never starts the Docker workflow — which is how 2.0.0 shipped without an
  # image. v1 papered over this with a personal access token; chaining needs
  # no token at all and cannot expire.
  docker:
    name: Publish image
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
